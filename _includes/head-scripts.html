<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<script>
/* Force light mode (disable dark/night mode) */
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
  } catch (e) {}
})();
</script>

<script>
  document.documentElement.style.scrollBehavior = "smooth";
</script>

<style>
  /* Ensure the body has no margin to prevent white borders */
  body {
    margin: 0;
    padding: 0;
    overflow-x: hidden; /* Prevent horizontal scroll from full-bleed hack */
  }

  /* Wide & Clean Title */
  .moca-hero-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    /* Responsive sizing: Starts at 3.5rem, grows to 6rem */
    font-size: clamp(3.5rem, 6vw, 6rem) !important;
    white-space: nowrap; /* Prevents "MoCA Lab" from breaking into two lines */
    color: #ffffff !important;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  /* Subtitle: Wide enough to not look like a column */
  .moca-hero-subtitle {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(1.2rem, 2vw, 1.5rem) !important;
    color: rgba(255, 255, 255, 0.9) !important;
    line-height: 1.5;
    max-width: 900px; /* Increased from 800px for wider text block */
  }

  /* Gold Highlight in Subtitle */
  .moca-hero-subtitle strong {
    color: #D59F0F !important;
    font-weight: 500;
  }

  /* Mobile: Allow text wrap on small screens */
  @media (max-width: 768px) {
    .moca-hero-title {
      white-space: normal;
      font-size: 3rem !important;
    }
    .moca-home-hero {
      margin-left: 0;
      margin-right: 0;
      width: 100%;
      left: 0;
    }
  }
</style>

{% if page.math or site.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
