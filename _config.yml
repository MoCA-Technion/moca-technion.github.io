title: "MoCA Lab"
tagline: "Mobility Computation & Analytics Lab"
description: "MoCA (Mobility Computation & Analytics) is a Technion lab studying how people, platforms, and policies interact in mobility systems to design efficient and effective human-centered transport."
url: "https://moca-technion.github.io"
baseurl: ""

theme: bulma-clean-theme
permalink: pretty
fixed_navbar: top
theme_color: "#002147"

footer_menu: footer_menu

plugins:
  - jekyll-sitemap
  - jekyll-feed

# Sitemap configuration for better SEO
# Note: jekyll-sitemap plugin auto-generates sitemap.xml
# Submit to Google Search Console as: sitemap.xml (not full URL)

# Google Analytics - Uncomment and add your Measurement ID to track visitors
# Get your ID from: https://analytics.google.com/
# Format: G-XXXXXXXXXX
# google_analytics: "G-XXXXXXXXXX"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  syntax_highlighter: rouge

scholar:
  author_id: "lEg_t6kAAAAJ"
  hl: "en"
  sort: "pubdate"

collections:
  people:
    output: true
    permalink: /people/:name/
  news:
    output: true
    permalink: /news/:name/
  projects:
    output: true
    permalink: /projects/:name/
    
defaults:
  - scope:
      path: "_people"
      type: "people"
    values:
      layout: "person"
  - scope:
      path: "_news"
      type: "news"
    values:
      layout: "news"
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "project"

exclude:
  - scripts/
  - README.md


sass:
  style: compressed
