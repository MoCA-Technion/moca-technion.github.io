<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
  } catch (e) {}
})();
</script>

<style>
  html, body {
    overflow-x: hidden; /* Essential for the full-width hack */
    width: 100%;
    margin: 0; 
    padding: 0;
  }

  /* Desktop Default */
  .moca-hero-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(3.5rem, 6vw, 6rem) !important;
    white-space: nowrap; 
    color: #ffffff !important;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .moca-hero-subtitle {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(1.2rem, 2vw, 1.5rem) !important;
    color: rgba(255, 255, 255, 0.9) !important;
    line-height: 1.5;
    max-width: 800px; 
  }
  
  .moca-hero-subtitle strong {
    color: #D59F0F !important;
    font-weight: 500;
  }

  /* MOBILE FIXES (Based on your Screenshot) */
  @media (max-width: 768px) {
    /* 1. Shrink Title to fit "MoCA Lab" on one line */
    .moca-hero-title {
      font-size: 3rem !important; /* Smaller size for phones */
      white-space: nowrap !important; /* Force one line */
    }
    
    /* 2. Shrink Subtitle and Kicker */
    .moca-hero-subtitle {
      font-size: 1.1rem !important;
      line-height: 1.4;
      max-width: 100%;
    }
    
    /* 3. Kicker text (Technion...) adjustment */
    .moca-kicker {
      font-size: 0.7rem !important;
      letter-spacing: 0.5px !important;
    }
  }
</style>

{% if page.math or site.math %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
