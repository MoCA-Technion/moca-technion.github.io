<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
  } catch (e) {}
})();
</script>

<style>
  /* Prevent horizontal scroll on mobile */
  html, body {
    overflow-x: hidden;
    width: 100%;
    margin: 0; 
    padding: 0;
  }

  /* Responsive Hero Title */
  .moca-hero-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    /* Desktop: 6rem | Mobile: 3rem */
    font-size: clamp(3rem, 8vw, 6rem) !important;
    white-space: nowrap; 
    color: #ffffff !important;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  /* Responsive Subtitle */
  .moca-hero-subtitle {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 3vw, 1.5rem) !important;
    color: rgba(255, 255, 255, 0.9) !important;
    line-height: 1.5;
    max-width: 800px; 
  }

  .moca-hero-subtitle strong {
    color: #D59F0F !important;
    font-weight: 500;
  }

  /* STRICT MOBILE OVERRIDES */
  @media (max-width: 768px) {
    /* Allow wrapping on phones so "MoCA Lab" fits */
    .moca-hero-title {
      white-space: normal !important; 
      font-size: 3.5rem !important;
      line-height: 1.1;
    }
    
    /* Ensure subtitle is readable */
    .moca-hero-subtitle {
      font-size: 1.2rem !important;
      max-width: 100%;
    }
    
    /* Fix Hero Padding manually */
    .moca-home-hero {
      padding-top: 3rem !important;
      padding-bottom: 3rem !important;
    }
  }
</style>

{% if page.math or site.math %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
