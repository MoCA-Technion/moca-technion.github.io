<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
  } catch (e) {}
})();
</script>

<style>
  /* 1. Global Width Lock (Matches Container) */
  .container {
    max-width: 1280px !important;
    width: 90% !important;
    margin: 0 auto !important;
  }

  /* 2. Hero Text */
  .moca-hero-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(3.5rem, 6vw, 6rem) !important;
    white-space: nowrap; 
    color: #ffffff !important;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .moca-hero-subtitle {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(1.2rem, 2vw, 1.5rem) !important;
    color: rgba(255, 255, 255, 0.9) !important;
    line-height: 1.6;
    max-width: 800px; 
  }

  .moca-hero-subtitle strong {
    color: #D59F0F !important;
    font-weight: 500;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .moca-hero-title { white-space: normal; font-size: 3rem !important; }
  }
</style>

{% if page.math or site.math %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
