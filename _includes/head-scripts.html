<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<script>
/* Force light mode */
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
  } catch (e) {}
})();
</script>

<script>
  document.documentElement.style.scrollBehavior = "smooth";
</script>

<style>
  /* Reset body margins */
  body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* GLOBAL HERO TEXT FIX 
     Matches the container width set in app.scss (1344px)
  */
  
  .moca-hero-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(3.5rem, 6vw, 6rem) !important;
    white-space: nowrap; 
    color: #ffffff !important;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .moca-hero-subtitle {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(1.2rem, 2vw, 1.5rem) !important;
    color: rgba(255, 255, 255, 0.9) !important;
    line-height: 1.6;
    
    /* Ensure subtitle lines up nicely with the title */
    max-width: 800px; 
  }

  .moca-hero-subtitle strong {
    color: #D59F0F !important;
    font-weight: 500;
  }

  /* Mobile Tweaks */
  @media (max-width: 768px) {
    .moca-hero-title {
      white-space: normal;
      font-size: 3rem !important;
    }
    .moca-home-hero {
      padding-top: 5rem;
    }
  }
</style>

{% if page.math or site.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
