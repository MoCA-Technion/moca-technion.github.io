<style>
  /* Set the background immediately to avoid white flash */
  .moca-home-hero {
    background-color: #002147; /* moca-navy */
    min-height: 60vh;
    display: flex;
    align-items: center;
  }
  
  /* Style the text immediately so it doesn't wait for Bulma */
  .moca-hero-title {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 5rem; /* Fallback size */
    color: #fff;
    margin: 0;
    opacity: 1 !important; /* Force visibility */
  }
  
  /* Optional: Style subtitle too */
  .moca-hero-subtitle {
    font-family: system-ui, -apple-system, sans-serif;
    color: rgba(255,255,255,0.9);
    font-size: 1.5rem;
  }

  /* Responsive adjustments for mobile to prevent huge text layout shifts */
  @media (max-width: 768px) {
    .moca-hero-title { font-size: 3.5rem; }
  }
</style>
<script>
/* Force light mode (disable dark/night mode) */
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
    localStorage.removeItem('theme');
    localStorage.removeItem('color-theme');
    localStorage.removeItem('bulma-theme');
    localStorage.removeItem('darkMode');
  } catch (e) {}
})();
</script>

<script>
  document.documentElement.style.scrollBehavior = "smooth";
</script>

{% if page.math or site.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<style>
  /* 1. Container Fix: Ensure content isn't too narrow */
  .moca-home-hero .hero-body .container {
    max-width: 1200px !important; /* Give it more breathing room */
    width: 90%;
  }

  /* 2. Title Fix: Balanced size & prevent wrapping */
  .moca-hero-title {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 700;

    /* REVISED SIZE:
       Min: 3rem (mobile)
       Scales at: 5vw (much gentler scaling)
       Max: 6rem (approx 96px, large but fits on one line)
    */
    font-size: clamp(3rem, 5vw, 6rem) !important;

    white-space: nowrap; /* Forces "MoCA Lab" to stay on one line */
    line-height: 1.1;
    color: #fff !important;
    margin-bottom: 1.5rem;
  }

  /* 3. Subtitle Fix: Wider reading area */
  .moca-hero-subtitle {
    font-size: clamp(1.25rem, 2vw, 1.75rem) !important;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.95) !important;

    /* Allow subtitle to span wider so it doesn't look like a thin column */
    max-width: 100%;
  }

  /* Mobile tweaks to prevent overflow */
  @media (max-width: 768px) {
    .moca-hero-title {
      white-space: normal; /* Allow wrapping on very small phones only */
      font-size: 3.5rem !important;
    }
  }
</style>
