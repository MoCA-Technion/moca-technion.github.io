{% include seo.html %}

<!-- Favicon - Comprehensive support for all browsers and platforms -->
<link rel="icon" type="image/jpeg" href="{{ site.baseurl }}/moca_lab_icon.jpg">
<link rel="shortcut icon" type="image/jpeg" href="{{ site.baseurl }}/moca_lab_icon.jpg">
<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="{{ site.baseurl }}/moca_lab_icon.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/moca_lab_icon.jpg">
<!-- Android Chrome -->
<link rel="icon" type="image/jpeg" sizes="192x192" href="{{ site.baseurl }}/moca_lab_icon.jpg">
<link rel="icon" type="image/jpeg" sizes="512x512" href="{{ site.baseurl }}/moca_lab_icon.jpg">
<!-- Windows Tiles -->
<meta name="msapplication-TileImage" content="{{ site.baseurl }}/moca_lab_icon.jpg">
<meta name="msapplication-TileColor" content="#002147">
<!-- Safari Pinned Tab -->
<link rel="mask-icon" href="{{ site.baseurl }}/moca_lab_icon.jpg" color="#002147">
<!-- Theme Color -->
<meta name="theme-color" content="#002147">

<!-- DNS Prefetch and Preconnect for Performance -->
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Load Fonts with display=swap for better performance -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"></noscript>

<script>
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
  } catch (e) {}
})();
</script>

<style>
  html, body {
    overflow-x: hidden; /* Essential for the full-width hack */
    width: 100%;
    margin: 0; 
    padding: 0;
  }

  /* Desktop Default */
  .moca-hero-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(3.5rem, 6vw, 6rem) !important;
    white-space: nowrap; 
    color: #ffffff !important;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .moca-hero-subtitle {
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: clamp(1.2rem, 2vw, 1.5rem) !important;
    color: rgba(255, 255, 255, 0.9) !important;
    line-height: 1.5;
    max-width: 800px; 
  }
  
  .moca-hero-subtitle strong {
    color: #D59F0F !important;
    font-weight: 500;
  }

  /* MOBILE FIXES (Based on your Screenshot) */
  @media (max-width: 768px) {
    /* 1. Shrink Title to fit "MoCA Lab" on one line */
    .moca-hero-title {
      font-size: 3rem !important; /* Smaller size for phones */
      white-space: nowrap !important; /* Force one line */
    }
    
    /* 2. Shrink Subtitle and Kicker */
    .moca-hero-subtitle {
      font-size: 1.1rem !important;
      line-height: 1.4;
      max-width: 100%;
    }
    
    /* 3. Kicker text (Technion...) - two lines, larger and better aligned */
    .moca-home-hero .moca-kicker {
      font-size: 0.85rem !important;
      letter-spacing: 0.8px !important;
      margin-bottom: 0.75rem !important;
      margin-left: 0 !important;
      padding-left: 0 !important;
      text-align: left !important;
      white-space: normal !important;
      line-height: 1.4 !important;
      max-width: 100% !important;
      word-break: break-word !important;
    }
    
    /* Show line break on mobile */
    .moca-home-hero .moca-kicker .mobile-break {
      display: block !important;
    }
    
    /* 4. Card kicker text - larger on mobile for better readability */
    .moca-slab .moca-kicker,
    .moca-kicker--dark {
      font-size: 0.9rem !important;
      font-weight: 600 !important;
    }
    
    /* 5. Better left alignment for hero content - align to vertical line */
    .moca-home-hero {
      padding-left: 0 !important;
    }
    
    .moca-home-hero .hero-body {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    
    .moca-home-hero .container {
      padding-left: 1rem !important; /* Match section container padding */
      padding-right: 1rem !important;
    }
    
    /* Section headings align to same vertical line */
    .section .container {
      padding-left: 1rem !important;
      padding-right: 1rem !important;
    }
  }

  /* Sticky footer - simple and reliable approach */
  html {
    height: 100% !important;
  }
  
  body {
    min-height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    padding-top: 4rem !important; /* Account for fixed navbar */
  }
  
  /* Skip link doesn't affect layout */
  body > .is-sr-only {
    flex: 0 0 auto !important;
  }
  
  /* Navbar is fixed, so it doesn't participate in flex */
  
  /* All sections before footer should be flexible */
  body > section:not(.footer) {
    flex: 0 0 auto !important;
  }
  
  /* The last content section before footer expands to fill space */
  body > section.section:last-of-type:not(.footer) {
    flex: 1 0 auto !important;
    display: flex !important;
    flex-direction: column !important;
  }
  
  /* Footer stays at bottom */
  .footer {
    flex: 0 0 auto !important;
    margin-top: auto !important;
  }
</style>

{% if page.math or site.math %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
