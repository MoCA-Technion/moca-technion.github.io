<style>
  /* Set the background immediately to avoid white flash */
  .moca-home-hero {
    background-color: #002147; /* moca-navy */
    min-height: 60vh;
    display: flex;
    align-items: center;
  }
  
  /* Style the text immediately so it doesn't wait for Bulma */
  .moca-hero-title {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 5rem; /* Fallback size */
    color: #fff;
    margin: 0;
    opacity: 1 !important; /* Force visibility */
  }
  
  /* Optional: Style subtitle too */
  .moca-hero-subtitle {
    font-family: system-ui, -apple-system, sans-serif;
    color: rgba(255,255,255,0.9);
    font-size: 1.5rem;
  }

  /* Responsive adjustments for mobile to prevent huge text layout shifts */
  @media (max-width: 768px) {
    .moca-hero-title { font-size: 3.5rem; }
  }
</style>
<script>
/* Force light mode (disable dark/night mode) */
(function () {
  try {
    document.documentElement.setAttribute('data-theme', 'light');
    document.documentElement.classList.remove('dark');
    localStorage.removeItem('theme');
    localStorage.removeItem('color-theme');
    localStorage.removeItem('bulma-theme');
    localStorage.removeItem('darkMode');
  } catch (e) {}
})();
</script>

<script>
  document.documentElement.style.scrollBehavior = "smooth";
</script>

{% if page.math or site.math %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<style>
  /* 1. Force the title to be BIG immediately */
  .moca-hero-title {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 700;
    /* This makes it responsive: Minimum 4rem, scales with width (10vw), Max 8.5rem */
    font-size: clamp(4rem, 10vw, 8.5rem) !important;
    line-height: 1.1;
    color: #fff !important;
    margin-bottom: 1rem;
    display: block; /* Ensures it takes up the full line */
  }

  /* 2. Ensure the subtitle is legible */
  .moca-hero-subtitle {
    font-size: clamp(1.2rem, 2.5vw, 2rem) !important;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.95) !important;
    max-width: 800px;
  }

  /* 3. Fix the container height so the text isn't cramped */
  .moca-home-hero .hero-body {
    min-height: 60vh;
    display: flex;
    align-items: center;
    padding-top: 4rem;
    padding-bottom: 4rem;
  }
</style>
