title: "MoCA Lab"
tagline: "Mobility Computation & Analytics Lab"
description: "MoCA (Mobility Computation & Analytics) is a research lab at the Technion focusing on mobility systems, infrastructure analytics, and computation methods."
url: "https://moca-technion.github.io"
baseurl: ""

theme: bulma-clean-theme
permalink: pretty
fixed_navbar: top
theme_color: "#002147"

footer_menu: footer_menu

plugins:
  - jekyll-sitemap
  - jekyll-feed

# Sitemap configuration for better SEO
sitemap:
  # Change frequency options: always, hourly, daily, weekly, monthly, yearly, never
  changefreq: weekly
  # Priority: 0.0 to 1.0 (default: 0.5)
  priority: 0.7
  # Exclude specific files/paths from sitemap
  exclude:
    - "/404.html"
    - "/feed.xml"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  syntax_highlighter: rouge

scholar:
  author_id: "lEg_t6kAAAAJ"
  hl: "en"
  sort: "pubdate"

collections:
  people:
    output: true
    permalink: /people/:name/
  news:
    output: true
    permalink: /news/:name/
  projects:
    output: true
    permalink: /projects/:name/
    
defaults:
  - scope:
      path: "_people"
      type: "people"
    values:
      layout: "person"
  - scope:
      path: "_news"
      type: "news"
    values:
      layout: "news"
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "project"

exclude:
  - scripts/
  - README.md
  - OPTIMIZATION_CHECKLIST.md
  - SEO_PERFORMANCE.md
  - GOOGLE_INDEXING_GUIDE.md
  - QUICK_START_GOOGLE.md


sass:
  style: compressed
